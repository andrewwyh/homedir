---
- name: Install Tailscale on Ubuntu
  hosts: all
  gather_facts: true
  become: true

  vars:
    tailscale_package_repo: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}"

  tasks:
    - name: Require Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'

    - name: Ensure the APT keyring directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Install the Tailscale APT signing key
      ansible.builtin.get_url:
        url: "{{ tailscale_package_repo }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'
        force: true

    - name: Install the official Tailscale APT source
      ansible.builtin.get_url:
        url: "{{ tailscale_package_repo }}.tailscale-keyring.list"
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: '0644'
        force: true

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Enable and start the Tailscale service
      ansible.builtin.systemd_service:
        name: tailscaled.service
        enabled: true
        state: started
