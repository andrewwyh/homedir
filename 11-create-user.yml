---
- name: Create the user account with sudo access
  hosts: all
  gather_facts: false
  become: true

  vars_prompt:
    - name: new_user_password
      prompt: "Password for user"
      private: true
      confirm: true

  tasks:
    - name: Require a password
      ansible.builtin.assert:
        that:
          - (new_user_password | default('', true) | length) > 0
        fail_msg: Enter a password for user when prompted.
      no_log: true

    - name: Create user and grant sudo group membership
      ansible.builtin.user:
        name: user
        groups: sudo
        append: true
        create_home: true
        shell: /bin/bash
        password: "{{ new_user_password | password_hash('sha512') }}"
        update_password: on_create
        state: present
      no_log: true
