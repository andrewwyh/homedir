---
- name: Install the latest stable Docker Engine on Ubuntu
  hosts: all
  gather_facts: true
  become: true
  become_method: sudo

  vars_prompt:
    - name: ansible_become_password
      prompt: "Sudo password for the target hosts"
      private: true

  tasks:
    - name: Require Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'

    - name: Read the target's APT architecture
      ansible.builtin.command: dpkg --print-architecture
      register: docker_apt_architecture
      changed_when: false
      check_mode: false

    - name: Ensure CA certificates are installed
      ansible.builtin.apt:
        name: ca-certificates
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure the APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker's APT signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Configure Docker's stable APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Architectures: {{ docker_apt_architecture.stdout }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install or upgrade Docker Engine and its plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: true
        fail_on_autoremove: true

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker.service
        enabled: true
        state: started
