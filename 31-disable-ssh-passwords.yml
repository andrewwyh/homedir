---
- name: Require public-key authentication over SSH on Ubuntu
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Set the global SSH authentication policy before included configuration
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        insertbefore: BOF
        marker: '# {mark} ANSIBLE MANAGED SSH AUTHENTICATION'
        block: |
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AuthenticationMethods publickey
        backup: true
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart Ubuntu SSH

  handlers:
    - name: Restart Ubuntu SSH
      ansible.builtin.systemd_service:
        name: ssh.service
        state: restarted
